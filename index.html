<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
        <meta name="theme-color" content="#0d0f14">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
        <meta name="apple-mobile-web-app-title" content="To-Do">
        <link rel="manifest" href="manifest.json">
        <link rel="apple-touch-icon" href="icon-192.png">
        <title>My To-Do List</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <!-- ================= Lock screen ================= -->
        <div class="lock-screen" id="lockScreen">
            <div class="lock-box">
                <div class="lock-icon"></div>
                <h2 id="lockTitle">Unlock</h2>
                <p class="lock-sub" id="lockSub">Enter your password to open your tasks.</p>
                <form id="lockForm" autocomplete="off">
                    <input type="password" id="lockPass" placeholder="Password" autocomplete="current-password">
                    <input type="password" id="lockPass2" placeholder="Confirm password" autocomplete="new-password" hidden>
                    <div class="lock-error" id="lockError" role="alert"></div>
                    <button type="submit" id="lockSubmit">Unlock</button>
                </form>
                <button type="button" class="clear-btn bio-btn" id="bioUnlockBtn" hidden>Use fingerprint</button>
                <button type="button" class="link-btn" id="resetBtn">Forgot password? Erase everything</button>
            </div>
        </div>

        <!-- ================= App ================= -->
        <div class="todo-card" id="appCard" hidden>
            <h1>My To-Do List</h1>
            <p class="subtitle" id="dateLabel"></p>

            <div class="notify-bar">
                <span id="notifyStatus">Alarms are off</span>
                <div class="notify-actions">
                    <button type="button" class="clear-btn" id="notifyBtn">Enable alarms</button>
                    <button type="button" class="clear-btn" id="testAlarmBtn">Test alarm</button>
                    <button type="button" class="clear-btn" id="lockNowBtn">Lock</button>
                </div>
            </div>

            <div class="progress-wrap">
                <div class="progress-label">
                    <span id="progressText">0 of 0 completed</span>
                    <span id="progressPct">0%</span>
                </div>
                <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
            </div>

            <form id="taskForm">
                <div class="input-group">
                    <input type="text" id="taskInput" placeholder="Add new task..." autocomplete="off">
                    <button type="submit">Add</button>
                </div>
                <input type="text" id="noteInput" class="note-input" placeholder="Notes (optional)" autocomplete="off">
                <div class="options-row">
                    <label class="field">Priority
                        <select id="prioritySelect">
                            <option value="low">Low</option>
                            <option value="medium" selected>Medium</option>
                            <option value="high">High</option>
                        </select>
                    </label>
                    <label class="field">Due date
                        <input type="date" id="dueInput">
                    </label>
                    <label class="field">Remind at
                        <input type="time" id="timeInput" value="09:00">
                    </label>
                </div>
            </form>

            <div class="toolbar">
                <input type="text" id="searchInput" class="search" placeholder="Search tasks..." autocomplete="off">
                <div class="filters">
                    <button type="button" class="filter-btn active" data-filter="all">All</button>
                    <button type="button" class="filter-btn" data-filter="active">Active</button>
                    <button type="button" class="filter-btn" data-filter="completed">Done</button>
                </div>
            </div>

            <ul id="taskList"></ul>

            <div class="footer">
                <span id="itemsLeft">0 items left</span>
                <button type="button" class="clear-btn" id="clearCompleted">Clear completed</button>
            </div>
            <p class="hint">Tap Edit to change a task. On a computer you can also double-click or drag to reorder.</p>

            <details class="security">
                <summary>Security</summary>
                <div class="security-body">
                    <button type="button" class="clear-btn" id="bioToggleBtn">Enable fingerprint unlock</button>
                    <label class="field">Auto-lock
                        <select id="autoLockSelect">
                            <option value="0">As soon as I leave the app</option>
                            <option value="60000">After 1 minute away</option>
                            <option value="300000">After 5 minutes away</option>
                            <option value="-1">Never (manual Lock only)</option>
                        </select>
                    </label>
                    <form id="changePassForm" class="change-pass" autocomplete="off">
                        <input type="password" id="curPass" placeholder="Current password" autocomplete="current-password">
                        <input type="password" id="newPass" placeholder="New password (6+ characters)" autocomplete="new-password">
                        <button type="submit" class="clear-btn">Change password</button>
                        <div class="lock-error" id="passMsg" role="status"></div>
                    </form>
                </div>
            </details>
        </div>

        <div class="toast-container" id="toastContainer"></div>

        <div class="alarm-overlay" id="alarmOverlay" hidden>
            <div class="alarm-box">
                <div class="alarm-pulse"></div>
                <h2>Alarm</h2>
                <div id="alarmList"></div>
            </div>
        </div>

        <script>
            const DEFAULT_TIME = '09:00';

            // Storage keys
            const VAULT_KEY = 'todo_vault';        // password-wrapped data key (no tasks inside)
            const DATA_KEY = 'todo_data';          // AES-GCM encrypted tasks
            const BIO_META = 'todo_bio';           // fingerprint-wrapped data key + credential id
            const SCHED_KEY = 'todo_schedule';     // reminder times only (no task text) so alarms can ring while locked
            const FIRED_KEY = 'todo_locked_fired'; // reminders that rang while locked
            const AUTOLOCK_KEY = 'todo_autolock';
            const OLD_PLAIN_KEY = 'todo_tasks_v2'; // earlier unencrypted version

            let tasks = [];
            let dataKey = null;     // lives in memory only while unlocked
            let isLocked = true;
            let lockMode = 'unlock'; // 'setup' | 'unlock'
            let suspendAutoLock = false;
            let filter = 'all';
            let query = '';
            let dragId = null;
            let editingId = null;

            const list = document.getElementById('taskList');
            const input = document.getElementById('taskInput');
            const $ = (id) => document.getElementById(id);

            // ---------- Crypto helpers ----------
            const enc = new TextEncoder();
            const dec = new TextDecoder();

            function toB64(buf) {
                const bytes = new Uint8Array(buf);
                let s = '';
                for (let i = 0; i < bytes.length; i += 0x8000) {
                    s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
                }
                return btoa(s);
            }
            function fromB64(str) {
                const bin = atob(str);
                const out = new Uint8Array(bin.length);
                for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
                return out;
            }

            async function derivePassKey(password, salt, iterations) {
                const base = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
                return crypto.subtle.deriveKey(
                    { name: 'PBKDF2', salt, iterations, hash: 'SHA-256' },
                    base,
                    { name: 'AES-GCM', length: 256 },
                    false,
                    ['wrapKey', 'unwrapKey']
                );
            }

            async function wrapDataKeyWithPassword(key, password) {
                const salt = crypto.getRandomValues(new Uint8Array(16));
                const iter = 250000;
                const iv = crypto.getRandomValues(new Uint8Array(12));
                const passKey = await derivePassKey(password, salt, iter);
                const wrapped = await crypto.subtle.wrapKey('raw', key, passKey, { name: 'AES-GCM', iv });
                localStorage.setItem(VAULT_KEY, JSON.stringify({
                    v: 1, salt: toB64(salt), iter, iv: toB64(iv), wrapped: toB64(wrapped)
                }));
            }

            async function unwrapDataKeyWithPassword(password) {
                const vault = JSON.parse(localStorage.getItem(VAULT_KEY));
                const passKey = await derivePassKey(password, fromB64(vault.salt), vault.iter);
                try {
                    return await crypto.subtle.unwrapKey(
                        'raw', fromB64(vault.wrapped), passKey,
                        { name: 'AES-GCM', iv: fromB64(vault.iv) },
                        { name: 'AES-GCM', length: 256 }, true, ['encrypt', 'decrypt']
                    );
                } catch (e) {
                    throw new Error('BADPW');
                }
            }

            async function createVault(password, initialTasks) {
                const key = await crypto.subtle.generateKey({ name: 'AES-GCM', length: 256 }, true, ['encrypt', 'decrypt']);
                await wrapDataKeyWithPassword(key, password);
                dataKey = key;
                tasks = initialTasks;
                await persist();
            }

            async function loadTasks() {
                const raw = localStorage.getItem(DATA_KEY);
                if (!raw) { tasks = []; return; }
                const d = JSON.parse(raw);
                const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: fromB64(d.iv) }, dataKey, fromB64(d.ct));
                tasks = JSON.parse(dec.decode(pt));
            }

            let persistChain = Promise.resolve();
            function persist() {
                persistChain = persistChain.then(async () => {
                    if (!dataKey) return;
                    const iv = crypto.getRandomValues(new Uint8Array(12));
                    const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, dataKey, enc.encode(JSON.stringify(tasks)));
                    localStorage.setItem(DATA_KEY, JSON.stringify({ iv: toB64(iv), ct: toB64(ct) }));
                }).catch(() => {});
                return persistChain;
            }

            function save() {
                persist();
                rebuildSchedule();
            }

            // ---------- Date / time helpers ----------
            function daysUntil(due) {
                const now = new Date();
                const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
                const [y, m, d] = due.split('-').map(Number);
                const target = new Date(y, m - 1, d);
                return Math.round((target - today) / 86400000);
            }

            function dayStart(due) {
                const [y, m, d] = due.split('-').map(Number);
                return new Date(y, m - 1, d).getTime();
            }

            // Date/time at which a reminder should fire, offsetDays before the due date
            function reminderMoment(due, time, offsetDays) {
                const [y, m, d] = due.split('-').map(Number);
                const [hh, mm] = (time || DEFAULT_TIME).split(':').map(Number);
                return new Date(y, m - 1, d - offsetDays, hh, mm);
            }

            function formatTime(time) {
                const [hh, mm] = (time || DEFAULT_TIME).split(':').map(Number);
                return new Date(2000, 0, 1, hh, mm).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
            }

            // ---------- Toasts ----------
            function showToast(title, body) {
                const box = $('toastContainer');
                const t = document.createElement('div');
                t.className = 'toast';
                const h = document.createElement('strong');
                h.textContent = title;
                const p = document.createElement('span');
                p.textContent = body;
                const x = document.createElement('button');
                x.type = 'button';
                x.className = 'toast-close';
                x.textContent = '×';
                x.addEventListener('click', () => t.remove());
                t.append(h, p, x);
                box.appendChild(t);
                setTimeout(() => t.remove(), 15000);
            }

            // ---------- Alarm (sound + full-screen alert) ----------
            const SNOOZE_MINUTES = 5;
            let audioCtx = null;
            let alarmTimer = null;
            let titleTimer = null;
            let swReg = null;
            const originalTitle = document.title;
            const activeAlarms = [];

            function unlockAudio() {
                try {
                    if (!audioCtx) {
                        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    }
                    if (audioCtx.state === 'suspended') audioCtx.resume();
                } catch (e) {}
            }
            ['click', 'keydown', 'touchstart'].forEach(ev =>
                document.addEventListener(ev, unlockAudio, { passive: true }));

            function beep() {
                if (!audioCtx || audioCtx.state !== 'running') return;
                const t = audioCtx.currentTime;
                for (let i = 0; i < 3; i++) {
                    const start = t + i * 0.25;
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'square';
                    osc.frequency.value = i === 1 ? 1040 : 880;
                    gain.gain.setValueAtTime(0.0001, start);
                    gain.gain.exponentialRampToValueAtTime(0.25, start + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.2);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(start);
                    osc.stop(start + 0.22);
                }
                try { if (navigator.vibrate) navigator.vibrate([300, 150, 300]); } catch (e) {}
            }

            function startAlarmSound() {
                unlockAudio();
                if (alarmTimer) return;
                beep();
                alarmTimer = setInterval(beep, 1500);
                let flash = false;
                titleTimer = setInterval(() => {
                    flash = !flash;
                    document.title = flash ? '⏰ ALARM!' : originalTitle;
                }, 800);
            }

            function stopAlarmSound() {
                clearInterval(alarmTimer);
                clearInterval(titleTimer);
                alarmTimer = null;
                titleTimer = null;
                document.title = originalTitle;
                try { if (navigator.vibrate) navigator.vibrate(0); } catch (e) {}
            }

            function removeAlarm(alarm) {
                const i = activeAlarms.indexOf(alarm);
                if (i >= 0) activeAlarms.splice(i, 1);
                renderAlarms();
            }

            function renderAlarms() {
                const overlay = $('alarmOverlay');
                const box = $('alarmList');
                box.innerHTML = '';

                if (activeAlarms.length === 0) {
                    overlay.hidden = true;
                    stopAlarmSound();
                    return;
                }
                overlay.hidden = false;

                activeAlarms.forEach(alarm => {
                    const row = document.createElement('div');
                    row.className = 'alarm-item';

                    const h = document.createElement('strong');
                    h.textContent = alarm.title;
                    const p = document.createElement('span');
                    p.textContent = alarm.body;

                    const actions = document.createElement('div');
                    actions.className = 'edit-actions';

                    const dismiss = document.createElement('button');
                    dismiss.type = 'button';
                    dismiss.textContent = 'Dismiss';
                    dismiss.addEventListener('click', () => removeAlarm(alarm));
                    actions.appendChild(dismiss);

                    const task = tasks.find(t => t.id === alarm.taskId);
                    if (task) {
                        const snooze = document.createElement('button');
                        snooze.type = 'button';
                        snooze.className = 'clear-btn';
                        snooze.textContent = 'Snooze ' + SNOOZE_MINUTES + ' min';
                        snooze.addEventListener('click', () => {
                            task.snoozeUntil = Date.now() + SNOOZE_MINUTES * 60000;
                            save();
                            removeAlarm(alarm);
                        });

                        const done = document.createElement('button');
                        done.type = 'button';
                        done.className = 'clear-btn';
                        done.textContent = 'Mark done';
                        done.addEventListener('click', () => {
                            task.done = true;
                            task.snoozeUntil = null;
                            save();
                            removeAlarm(alarm);
                            render();
                        });
                        actions.append(snooze, done);
                    }

                    row.append(h, p, actions);
                    box.appendChild(row);
                });
                startAlarmSound();
            }

            function triggerAlarm(task, title, body) {
                const text = body || (task ? task.text : '');
                activeAlarms.push({ taskId: task ? task.id : null, title, body: text });
                renderAlarms();
                try {
                    if ('Notification' in window && Notification.permission === 'granted') {
                        const opts = {
                            body: text,
                            requireInteraction: true,
                            tag: 'alarm-' + (task ? task.id : 'generic'),
                            icon: 'icon-192.png',
                            badge: 'icon-192.png',
                            vibrate: [300, 150, 300]
                        };
                        if (swReg && swReg.showNotification) {
                            swReg.showNotification(title, opts).catch(() => {});
                        } else {
                            new Notification(title, opts);
                        }
                    }
                } catch (e) {}
            }

            $('testAlarmBtn').addEventListener('click', () => {
                triggerAlarm(null, 'Test alarm', 'This is how your task alarms will sound.');
            });

            // ---------- Reminder scheduling ----------
            // While the app is locked the tasks are encrypted, so the lock screen can only see
            // this list of times (no task text). That is enough to ring a generic alarm.
            function rebuildSchedule() {
                const entries = [];
                tasks.forEach(t => {
                    if (t.done) return;
                    if (t.snoozeUntil) {
                        entries.push({ k: t.id + '|snooze', at: t.snoozeUntil, until: t.snoozeUntil + 86400000 });
                    }
                    if (!t.due) return;
                    const n = t.notified || {};
                    if (!n.eve) {
                        entries.push({ k: t.id + '|eve', at: reminderMoment(t.due, t.time, 1).getTime(), until: dayStart(t.due) });
                    }
                    if (!n.day) {
                        entries.push({ k: t.id + '|day', at: reminderMoment(t.due, t.time, 0).getTime(), until: dayStart(t.due) + 86400000 });
                    }
                });
                try { localStorage.setItem(SCHED_KEY, JSON.stringify(entries)); } catch (e) {}
            }

            function lockedCheck() {
                if (!isLocked) return;
                let sched = [];
                let fired = [];
                try { sched = JSON.parse(localStorage.getItem(SCHED_KEY)) || []; } catch (e) {}
                try { fired = JSON.parse(localStorage.getItem(FIRED_KEY)) || []; } catch (e) {}
                const now = Date.now();
                let newly = 0;
                sched.forEach(e => {
                    if (e.at <= now && now < e.until && !fired.includes(e.k)) {
                        fired.push(e.k);
                        newly++;
                    }
                });
                if (newly) {
                    try { localStorage.setItem(FIRED_KEY, JSON.stringify(fired)); } catch (e) {}
                    triggerAlarm(null, 'Task reminder',
                        newly === 1 ? 'A task is due. Unlock to see which one.' : newly + ' tasks are due. Unlock to see them.');
                }
            }

            function applyLockedFired() {
                let fired = [];
                try { fired = JSON.parse(localStorage.getItem(FIRED_KEY)) || []; } catch (e) {}
                fired.forEach(k => {
                    const [id, kind] = k.split('|');
                    const t = tasks.find(x => String(x.id) === id);
                    if (!t) return;
                    t.notified = t.notified || {};
                    if (kind === 'eve') t.notified.eve = true;
                    else if (kind === 'day') t.notified.day = true;
                    else if (kind === 'snooze') t.snoozeUntil = null;
                });
                try { localStorage.removeItem(FIRED_KEY); } catch (e) {}
            }

            function checkReminders() {
                if (isLocked || !dataKey) return;
                const now = new Date();
                let changed = false;
                tasks.forEach(t => {
                    if (t.done || !t.due) return;
                    t.notified = t.notified || {};
                    const diff = daysUntil(t.due);

                    if (t.snoozeUntil && now.getTime() >= t.snoozeUntil) {
                        t.snoozeUntil = null;
                        changed = true;
                        triggerAlarm(t, 'Snoozed reminder');
                    }

                    if (diff === 1 && !t.notified.eve && now >= reminderMoment(t.due, t.time, 1)) {
                        t.notified.eve = true;
                        changed = true;
                        triggerAlarm(t, 'Due tomorrow at ' + formatTime(t.time));
                    }
                    if (diff === 0 && !t.notified.day && now >= reminderMoment(t.due, t.time, 0)) {
                        t.notified.day = true;
                        changed = true;
                        triggerAlarm(t, 'Due today at ' + formatTime(t.time));
                    }
                });
                if (changed) save();
                if (editingId === null) render();
            }

            function updateNotifyUI() {
                const status = $('notifyStatus');
                const btn = $('notifyBtn');
                if (!('Notification' in window)) {
                    status.textContent = 'System alerts unsupported (in-app alarm only)';
                    btn.style.display = 'none';
                } else if (Notification.permission === 'granted') {
                    status.textContent = 'Alarms are on';
                    btn.style.display = 'none';
                } else if (Notification.permission === 'denied') {
                    status.textContent = 'Blocked in browser (in-app alarm only)';
                    btn.style.display = 'none';
                } else {
                    status.textContent = 'Alarms are off';
                    btn.style.display = '';
                }
            }

            $('notifyBtn').addEventListener('click', () => {
                if (!('Notification' in window)) return;
                Notification.requestPermission().then(() => {
                    updateNotifyUI();
                    if (Notification.permission === 'granted') {
                        showToast('Alarms on', 'An alarm will ring the day before and on the due day, at your chosen time.');
                    }
                });
            });

            // ---------- Tasks ----------
            function addTask() {
                const text = input.value.trim();
                if (text === '') {
                    input.focus();
                    return;
                }
                tasks.unshift({
                    id: Date.now() + Math.random(),
                    text,
                    note: $('noteInput').value.trim(),
                    done: false,
                    priority: $('prioritySelect').value,
                    due: $('dueInput').value,
                    time: $('timeInput').value || DEFAULT_TIME,
                    notified: {}
                });
                input.value = '';
                $('noteInput').value = '';
                $('dueInput').value = '';
                $('timeInput').value = DEFAULT_TIME;
                save();
                checkReminders();
                render();
                input.focus();
            }

            function makeField(labelText, control) {
                const label = document.createElement('label');
                label.className = 'field';
                label.append(labelText, control);
                return label;
            }

            function buildEditItem(task) {
                const li = document.createElement('li');
                li.className = 'editing priority-' + task.priority;
                li.draggable = false;

                const text = document.createElement('input');
                text.type = 'text';
                text.value = task.text;
                text.placeholder = 'Task';

                const note = document.createElement('input');
                note.type = 'text';
                note.value = task.note || '';
                note.placeholder = 'Notes (optional)';

                const priority = document.createElement('select');
                ['low', 'medium', 'high'].forEach(p => {
                    const o = document.createElement('option');
                    o.value = p;
                    o.textContent = p.charAt(0).toUpperCase() + p.slice(1);
                    if (p === task.priority) o.selected = true;
                    priority.appendChild(o);
                });

                const due = document.createElement('input');
                due.type = 'date';
                due.value = task.due || '';

                const time = document.createElement('input');
                time.type = 'time';
                time.value = task.time || DEFAULT_TIME;

                const grid = document.createElement('div');
                grid.className = 'options-row';
                grid.append(
                    makeField('Priority', priority),
                    makeField('Due date', due),
                    makeField('Remind at', time)
                );

                const actions = document.createElement('div');
                actions.className = 'edit-actions';

                const saveBtn = document.createElement('button');
                saveBtn.type = 'button';
                saveBtn.textContent = 'Save';

                const cancelBtn = document.createElement('button');
                cancelBtn.type = 'button';
                cancelBtn.className = 'clear-btn';
                cancelBtn.textContent = 'Cancel';

                const clearDue = document.createElement('button');
                clearDue.type = 'button';
                clearDue.className = 'clear-btn';
                clearDue.textContent = 'Clear date';
                clearDue.addEventListener('click', () => { due.value = ''; });

                function commit() {
                    const v = text.value.trim();
                    if (!v) {
                        text.focus();
                        return;
                    }
                    const newTime = time.value || DEFAULT_TIME;
                    const scheduleChanged = due.value !== (task.due || '') || newTime !== (task.time || DEFAULT_TIME);
                    task.text = v;
                    task.note = note.value.trim();
                    task.priority = priority.value;
                    task.due = due.value;
                    task.time = newTime;
                    if (scheduleChanged) {
                        task.notified = {}; // re-arm reminders
                        task.snoozeUntil = null;
                    }
                    editingId = null;
                    save();
                    checkReminders();
                    render();
                }
                function cancel() {
                    editingId = null;
                    render();
                }

                saveBtn.addEventListener('click', commit);
                cancelBtn.addEventListener('click', cancel);
                li.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') { e.preventDefault(); commit(); }
                    if (e.key === 'Escape') cancel();
                });

                actions.append(saveBtn, cancelBtn, clearDue);
                li.append(text, note, grid, actions);
                setTimeout(() => { text.focus(); text.select(); }, 0);
                return li;
            }

            function buildItem(task) {
                if (task.id === editingId) return buildEditItem(task);

                const li = document.createElement('li');
                li.className = 'priority-' + task.priority + (task.done ? ' done' : '');
                li.draggable = true;
                li.dataset.id = task.id;

                const cb = document.createElement('input');
                cb.type = 'checkbox';
                cb.checked = task.done;
                cb.addEventListener('change', () => {
                    task.done = cb.checked;
                    save();
                    render();
                });

                const body = document.createElement('div');
                body.className = 'task-body';

                const text = document.createElement('span');
                text.className = 'task-text';
                text.textContent = task.text;
                text.addEventListener('dblclick', () => { editingId = task.id; render(); });
                body.appendChild(text);

                if (task.note) {
                    const note = document.createElement('span');
                    note.className = 'task-note';
                    note.textContent = task.note;
                    body.appendChild(note);
                }

                if (task.due) {
                    const meta = document.createElement('span');
                    meta.className = 'task-meta';
                    const diff = daysUntil(task.due);
                    const overdue = !task.done && diff < 0;
                    const at = ' · remind ' + formatTime(task.time);
                    let label = 'Due: ' + task.due + at;
                    if (overdue) {
                        label = 'Overdue: ' + task.due;
                        meta.classList.add('overdue');
                    } else if (!task.done && diff === 0) {
                        label = 'Due today' + at;
                        meta.classList.add('due-soon');
                    } else if (!task.done && diff === 1) {
                        label = 'Due tomorrow' + at;
                        meta.classList.add('due-soon');
                    }
                    meta.textContent = label;
                    body.appendChild(meta);
                }

                const editBtn = document.createElement('button');
                editBtn.type = 'button';
                editBtn.className = 'icon-btn';
                editBtn.title = 'Edit';
                editBtn.textContent = 'Edit';
                editBtn.addEventListener('click', () => { editingId = task.id; render(); });

                const del = document.createElement('button');
                del.type = 'button';
                del.className = 'icon-btn delete-btn';
                del.title = 'Delete';
                del.textContent = 'Delete';
                del.addEventListener('click', () => {
                    tasks = tasks.filter(t => t.id !== task.id);
                    save();
                    render();
                });

                // Drag and drop reordering (desktop browsers)
                li.addEventListener('dragstart', () => {
                    dragId = task.id;
                    li.classList.add('dragging');
                });
                li.addEventListener('dragend', () => {
                    li.classList.remove('dragging');
                    dragId = null;
                });
                li.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    li.classList.add('drag-over');
                });
                li.addEventListener('dragleave', () => li.classList.remove('drag-over'));
                li.addEventListener('drop', (e) => {
                    e.preventDefault();
                    li.classList.remove('drag-over');
                    if (dragId === null || dragId === task.id) return;
                    const from = tasks.findIndex(t => t.id === dragId);
                    const to = tasks.findIndex(t => t.id === task.id);
                    if (from < 0 || to < 0) return;
                    const [moved] = tasks.splice(from, 1);
                    tasks.splice(to, 0, moved);
                    save();
                    render();
                });

                li.append(cb, body, editBtn, del);
                return li;
            }

            function render() {
                list.innerHTML = '';

                const q = query.toLowerCase();
                const visible = tasks.filter(t => {
                    if (t.id === editingId) return true;
                    if (filter === 'active' && t.done) return false;
                    if (filter === 'completed' && !t.done) return false;
                    return (t.text + ' ' + (t.note || '')).toLowerCase().includes(q);
                });

                if (visible.length === 0) {
                    const empty = document.createElement('li');
                    empty.className = 'empty-state';
                    empty.draggable = false;
                    empty.textContent = tasks.length === 0
                        ? 'No tasks yet. Add one above!'
                        : 'No tasks match your view.';
                    list.appendChild(empty);
                } else {
                    visible.forEach(t => list.appendChild(buildItem(t)));
                }

                const total = tasks.length;
                const done = tasks.filter(t => t.done).length;
                const pct = total === 0 ? 0 : Math.round((done / total) * 100);
                const left = total - done;

                $('progressText').textContent = done + ' of ' + total + ' completed';
                $('progressPct').textContent = pct + '%';
                $('progressFill').style.width = pct + '%';
                $('itemsLeft').textContent = left + (left === 1 ? ' item left' : ' items left');
            }

            $('taskForm').addEventListener('submit', (e) => {
                e.preventDefault();
                addTask();
            });

            $('searchInput').addEventListener('input', (e) => {
                query = e.target.value;
                render();
            });

            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    filter = btn.dataset.filter;
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b === btn));
                    render();
                });
            });

            $('clearCompleted').addEventListener('click', () => {
                tasks = tasks.filter(t => !t.done);
                save();
                render();
            });

            // ---------- Lock screen ----------
            function setLockError(msg) { $('lockError').textContent = msg || ''; }

            function showLockScreen(mode) {
                lockMode = mode;
                isLocked = true;
                $('appCard').hidden = true;
                $('lockScreen').hidden = false;
                $('lockPass').value = '';
                $('lockPass2').value = '';
                setLockError('');

                const setup = mode === 'setup';
                $('lockTitle').textContent = setup ? 'Create a password' : 'Unlock';
                $('lockSub').textContent = setup
                    ? 'Your tasks are encrypted on this phone with this password. There is no way to recover it if you forget it.'
                    : 'Enter your password to open your tasks.';
                $('lockSubmit').textContent = setup ? 'Create password' : 'Unlock';
                $('lockPass2').hidden = !setup;
                $('lockPass').autocomplete = setup ? 'new-password' : 'current-password';
                $('resetBtn').hidden = setup;

                const hasBio = !setup && !!localStorage.getItem(BIO_META);
                $('bioUnlockBtn').hidden = !hasBio;
                if (hasBio) {
                    if (!document.hidden) setTimeout(unlockWithBiometric, 400);
                } else {
                    setTimeout(() => { try { $('lockPass').focus(); } catch (e) {} }, 100);
                }
            }

            function afterUnlock() {
                isLocked = false;
                $('lockScreen').hidden = true;
                $('appCard').hidden = false;
                $('lockPass').value = '';
                $('lockPass2').value = '';
                setLockError('');
                $('dateLabel').textContent =
                    new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
                applyLockedFired();
                rebuildSchedule();
                persist();
                updateBioUI();
                $('autoLockSelect').value = getAutoLock();
                if (!$('autoLockSelect').value) $('autoLockSelect').value = '60000';
                updateNotifyUI();
                render();
                checkReminders();
            }

            async function lockApp() {
                if (isLocked) return;
                await persist();
                tasks = [];
                dataKey = null;
                editingId = null;
                query = '';
                $('searchInput').value = '';
                list.innerHTML = '';
                renderAlarms(); // drops task-specific buttons from any open alarm
                showLockScreen('unlock');
            }

            let failCount = 0;
            let lockoutUntil = 0;

            $('lockForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                setLockError('');
                const pw = $('lockPass').value;
                const btn = $('lockSubmit');

                if (lockMode === 'setup') {
                    if (pw.length < 6) { setLockError('Use at least 6 characters.'); return; }
                    if (pw !== $('lockPass2').value) { setLockError('Passwords do not match.'); return; }
                    btn.disabled = true;
                    try {
                        let existing = [];
                        try { existing = JSON.parse(localStorage.getItem(OLD_PLAIN_KEY)) || []; } catch (x) {}
                        await createVault(pw, existing);
                        try { localStorage.removeItem(OLD_PLAIN_KEY); } catch (x) {}
                        afterUnlock();
                    } catch (x) {
                        setLockError('Could not set up encryption in this browser.');
                    }
                    btn.disabled = false;
                    return;
                }

                if (Date.now() < lockoutUntil) {
                    setLockError('Too many attempts. Wait ' + Math.ceil((lockoutUntil - Date.now()) / 1000) + ' seconds.');
                    return;
                }
                if (!pw) { setLockError('Enter your password.'); return; }
                btn.disabled = true;
                try {
                    dataKey = await unwrapDataKeyWithPassword(pw);
                    await loadTasks();
                    failCount = 0;
                    afterUnlock();
                } catch (x) {
                    dataKey = null;
                    if (x.message === 'BADPW') {
                        failCount++;
                        if (failCount >= 5) {
                            failCount = 0;
                            lockoutUntil = Date.now() + 30000;
                            setLockError('Too many attempts. Wait 30 seconds.');
                        } else {
                            setLockError('Wrong password.');
                        }
                    } else {
                        setLockError('Could not read your saved tasks.');
                    }
                }
                btn.disabled = false;
            });

            $('lockNowBtn').addEventListener('click', lockApp);

            $('resetBtn').addEventListener('click', async () => {
                if (!confirm('Erase ALL tasks and the password on this device? This cannot be undone.')) return;
                [VAULT_KEY, DATA_KEY, BIO_META, SCHED_KEY, FIRED_KEY, OLD_PLAIN_KEY].forEach(k => {
                    try { localStorage.removeItem(k); } catch (e) {}
                });
                try { await idbDel('bio'); } catch (e) {}
                tasks = [];
                dataKey = null;
                showLockScreen('setup');
            });

            // ---------- Fingerprint (WebAuthn platform authenticator) ----------
            // The fingerprint check is done by the phone. After it succeeds, a key that is kept
            // in the browser's secure storage unwraps the data key. The password stays the strong
            // protection; the fingerprint is the quick way in.
            function idbOpen() {
                return new Promise((resolve, reject) => {
                    const r = indexedDB.open('todo_secure', 1);
                    r.onupgradeneeded = () => r.result.createObjectStore('keys');
                    r.onsuccess = () => resolve(r.result);
                    r.onerror = () => reject(r.error);
                });
            }
            async function idbGet(k) {
                const db = await idbOpen();
                return new Promise((resolve, reject) => {
                    const q = db.transaction('keys').objectStore('keys').get(k);
                    q.onsuccess = () => resolve(q.result);
                    q.onerror = () => reject(q.error);
                });
            }
            async function idbSet(k, v) {
                const db = await idbOpen();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction('keys', 'readwrite');
                    tx.objectStore('keys').put(v, k);
                    tx.oncomplete = () => resolve();
                    tx.onerror = () => reject(tx.error);
                });
            }
            async function idbDel(k) {
                const db = await idbOpen();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction('keys', 'readwrite');
                    tx.objectStore('keys').delete(k);
                    tx.oncomplete = () => resolve();
                    tx.onerror = () => reject(tx.error);
                });
            }

            async function bioSupported() {
                try {
                    return !!(window.isSecureContext && window.PublicKeyCredential &&
                        await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable());
                } catch (e) {
                    return false;
                }
            }

            async function updateBioUI() {
                const btn = $('bioToggleBtn');
                const supported = await bioSupported();
                const enabled = !!localStorage.getItem(BIO_META);
                if (!supported) {
                    btn.textContent = 'Fingerprint not available here';
                    btn.disabled = true;
                    return;
                }
                btn.disabled = false;
                btn.textContent = enabled ? 'Disable fingerprint unlock' : 'Enable fingerprint unlock';
            }

            async function enableBiometric() {
                if (!dataKey) return;
                suspendAutoLock = true;
                try {
                    const cred = await navigator.credentials.create({
                        publicKey: {
                            challenge: crypto.getRandomValues(new Uint8Array(32)),
                            rp: { name: 'My To-Do List' },
                            user: {
                                id: crypto.getRandomValues(new Uint8Array(16)),
                                name: 'owner',
                                displayName: 'Owner'
                            },
                            pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
                            authenticatorSelection: {
                                authenticatorAttachment: 'platform',
                                userVerification: 'required',
                                residentKey: 'discouraged'
                            },
                            timeout: 60000,
                            attestation: 'none'
                        }
                    });
                    const bioKey = await crypto.subtle.generateKey({ name: 'AES-GCM', length: 256 }, false, ['wrapKey', 'unwrapKey']);
                    const iv = crypto.getRandomValues(new Uint8Array(12));
                    const wrapped = await crypto.subtle.wrapKey('raw', dataKey, bioKey, { name: 'AES-GCM', iv });
                    await idbSet('bio', bioKey);
                    localStorage.setItem(BIO_META, JSON.stringify({
                        cred: toB64(cred.rawId), iv: toB64(iv), wrapped: toB64(wrapped)
                    }));
                    showToast('Fingerprint unlock on', 'Next time, use your fingerprint on the lock screen.');
                } catch (e) {
                    showToast('Could not turn on fingerprint',
                        e && e.name === 'NotAllowedError'
                            ? 'It was cancelled or not allowed.'
                            : 'This browser or phone does not support it. Make sure a screen lock and fingerprint are set up.');
                } finally {
                    suspendAutoLock = false;
                    updateBioUI();
                }
            }

            async function disableBiometric() {
                try { localStorage.removeItem(BIO_META); } catch (e) {}
                try { await idbDel('bio'); } catch (e) {}
                showToast('Fingerprint unlock off', 'You will use your password to unlock.');
                updateBioUI();
            }

            $('bioToggleBtn').addEventListener('click', () => {
                if (localStorage.getItem(BIO_META)) disableBiometric();
                else enableBiometric();
            });

            let bioBusy = false;
            async function unlockWithBiometric() {
                if (!isLocked || lockMode !== 'unlock' || bioBusy) return;
                let meta = null;
                try { meta = JSON.parse(localStorage.getItem(BIO_META)); } catch (e) {}
                if (!meta) return;
                bioBusy = true;
                suspendAutoLock = true;
                try {
                    await navigator.credentials.get({
                        publicKey: {
                            challenge: crypto.getRandomValues(new Uint8Array(32)),
                            allowCredentials: [{ type: 'public-key', id: fromB64(meta.cred), transports: ['internal'] }],
                            userVerification: 'required',
                            timeout: 60000
                        }
                    });
                    const bioKey = await idbGet('bio');
                    if (!bioKey) throw new Error('nokey');
                    dataKey = await crypto.subtle.unwrapKey(
                        'raw', fromB64(meta.wrapped), bioKey,
                        { name: 'AES-GCM', iv: fromB64(meta.iv) },
                        { name: 'AES-GCM', length: 256 }, true, ['encrypt', 'decrypt']
                    );
                    await loadTasks();
                    afterUnlock();
                } catch (e) {
                    dataKey = null;
                    if (!e || e.name !== 'NotAllowedError') {
                        setLockError('Fingerprint unlock failed. Use your password.');
                    }
                } finally {
                    bioBusy = false;
                    suspendAutoLock = false;
                }
            }
            $('bioUnlockBtn').addEventListener('click', unlockWithBiometric);

            // ---------- Change password ----------
            $('changePassForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const msg = $('passMsg');
                msg.textContent = '';
                const cur = $('curPass').value;
                const nw = $('newPass').value;
                if (!cur) { msg.textContent = 'Enter your current password.'; return; }
                if (nw.length < 6) { msg.textContent = 'New password needs at least 6 characters.'; return; }
                try {
                    await unwrapDataKeyWithPassword(cur); // verifies the current password
                } catch (x) {
                    msg.textContent = 'Current password is wrong.';
                    return;
                }
                try {
                    await wrapDataKeyWithPassword(dataKey, nw);
                    $('curPass').value = '';
                    $('newPass').value = '';
                    msg.textContent = 'Password changed.';
                } catch (x) {
                    msg.textContent = 'Could not change the password.';
                }
            });

            // ---------- Auto-lock ----------
            function getAutoLock() {
                const v = localStorage.getItem(AUTOLOCK_KEY);
                return v === null ? '60000' : v;
            }
            $('autoLockSelect').addEventListener('change', (e) => {
                try { localStorage.setItem(AUTOLOCK_KEY, e.target.value); } catch (x) {}
            });

            let hiddenAt = null;
            document.addEventListener('visibilitychange', () => {
                if (document.hidden) {
                    hiddenAt = Date.now();
                    return;
                }
                if (!isLocked && hiddenAt !== null && !suspendAutoLock) {
                    const limit = Number(getAutoLock());
                    if (limit >= 0 && Date.now() - hiddenAt >= limit) lockApp();
                }
                hiddenAt = null;
                checkReminders();
                lockedCheck();
            });

            // ---------- Startup ----------
            function init() {
                updateNotifyUI();

                if ('serviceWorker' in navigator &&
                    (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
                    navigator.serviceWorker.register('sw.js').then(r => { swReg = r; }).catch(() => {});
                }

                if (!window.crypto || !crypto.subtle) {
                    $('lockForm').hidden = true;
                    $('bioUnlockBtn').hidden = true;
                    $('resetBtn').hidden = true;
                    $('lockTitle').textContent = 'Secure connection needed';
                    $('lockSub').textContent = 'Encryption is only available over HTTPS or localhost. Open this app from its https:// address.';
                    return;
                }

                showLockScreen(localStorage.getItem(VAULT_KEY) ? 'unlock' : 'setup');
                setInterval(checkReminders, 30000);
                setInterval(lockedCheck, 30000);
                lockedCheck();
            }
            init();
        </script>
    </body>
</html>
